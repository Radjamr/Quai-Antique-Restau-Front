<div class="hero-scene text-center text-white">
    <div class="hero-scene-content">
        <h1>Mon Compte</h1>
    </div>
</div>

<div class = "container">
    <form>
        <div class="mb-3">
            <label for="NomInput" class="form-label">Nom</label>
            <input type="Nom" class="form-control" id="NomInput" placeholder="Votre Nom" value="John">
        </div>
        <div class="mb-3">
            <label for="PrénomInput" class="form-label">Prénom</label>
            <input type="Prénom" class="form-control" id="PrénomInput" placeholder="Votre Prénom" value="Doe">
        </div>
        <div class="mb-3">
            <label for="AllergieInput" class="form-label">Allergies</label>
            <input type="text" class="form-control" id="AllergieInput" placeholder="Vos allergies (fuits de mer, arachides...)" value="Cacahoouetes">
        </div>
        <div class="mb-3">
            <label for="NbConcicesInput" class="form-label">Nombre de convives habituel</label>
            <input type="Number" class="form-control" id="NbConcicesInput" placeholder="Combien vous êtes habituellement ?" value="4">
        </div>
        <div class="text-center">
            <button type="submit" class="btn btn-primary">Modifier vos information</button>
        </div>
    </form>
    <div class="text-center pt-3">
        <a href="/Editpassword">Modifier mes information personneles</a>
    </div>
</div>
