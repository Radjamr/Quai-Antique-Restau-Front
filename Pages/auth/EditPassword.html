<div class="hero-scene text-center text-white">
    <div class="hero-scene-content">
        <h1>Modifier Mon Compte</h1>
    </div>
</div>

<div class = "container">
    <form>
        <div class="mb-3">
            <label for="BackEmailInput" class="form-label">Ancien Mot de Passe</label>
            <input type="email" class="form-control" id="BackEmailInput">
        </div>
        <div class="mb-3">
            <label for="NewPasswordInput" class="form-label">Nouveau Mot de passe</label>
            <input type="password" class="form-control" id="NewPasswordInput">
        </div>
        <div class="mb-3">
            <label for="ValidateNewPasswordInput" class="form-label">Valider le Nouveau Mot de passe</label>
            <input type="password" class="form-control" id="ValidateNewPasswordInput">
        </div>
        <div class="text-center">
            <button type="submit" class="btn btn-primary">Valider</button>
            <button  type="submit" class="btn btn-secondary">Annuler</button>
        </div>
    </form>
</div>
